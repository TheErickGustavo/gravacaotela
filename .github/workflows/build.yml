name: Linux build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev

      - name: Check installer syntax
        run: bash -n install.sh

      - name: Compile and package
        run: |
          make
          make dist
          file build/gravacaotela
          tar -tzf dist/gravacaotela-linux-x86_64.tar.gz

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: gravacaotela-linux-x86_64
          path: dist/gravacaotela-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30
